    # 2026-10-22 from raw.githubusercontent.com/OrcaSlicer/OrcaSlicer/v2.4.2; CLI_SUCCESS (0) is
    # not an error. `hint` is Orca's own text for the code, from the `cli_errors` map in
    # src/OrcaSlicer.cpp v2.4.2 (lines 112-159; leading space of -101 trimmed). Each comment
    # names the macro and both source lines. A shell reports these codes modulo 256.
    error_codes:
      - code: -1  # CLI_ENVIRONMENT_ERROR: Utils.hpp:25; hint: OrcaSlicer.cpp:113
        name: CLI_ENVIRONMENT_ERROR
        meaning: environment error
        hint: "Failed setting up server environment."
      - code: -2  # CLI_INVALID_PARAMS: Utils.hpp:26; hint: OrcaSlicer.cpp:114
        name: CLI_INVALID_PARAMS
        meaning: invalid params
        hint: "Invalid parameters to the slicer."
      - code: -3  # CLI_FILE_NOTFOUND: Utils.hpp:27; hint: OrcaSlicer.cpp:115
        name: CLI_FILE_NOTFOUND
        meaning: file not found
